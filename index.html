<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Plan meals and groceries together" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f5f1" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121412" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Food Planner" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Food Planner</title>
    <script>
      // Sets the theme before the first paint so a saved choice does not flash; see useTheme.ts.
      (() => {
        const saved = localStorage.getItem("theme");
        const systemDark = matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme =
          saved === "light" || saved === "dark" ? saved : systemDark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
